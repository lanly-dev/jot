<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jot Password Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .header-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e1b4b;
    }
    .header-sub {
      font-size: 11.5px;
      color: #64748b;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      background: #e2e8f0;
      color: #475569;
    }
    .status-badge.connected {
      background: #dcfce7;
      color: #166534;
    }
    .status-badge.disconnected {
      background: #fee2e2;
      color: #991b1b;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus {
      border-color: #7c3aed;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-align: center;
      display: block;
      text-decoration: none;
    }
    .btn-primary {
      background: #7c3aed;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .btn-primary:hover {
      background: #6d28d9;
    }
    .btn-secondary {
      background: #ffffff;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .status-msg {
      font-size: 11.5px;
      margin-top: 8px;
      display: none;
      word-break: break-all;
    }
    .status-msg.error {
      display: block;
      color: #dc2626;
    }
    .status-msg.success {
      display: block;
      color: #16a34a;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">🔒</div>
    <div>
      <div class="header-title">Jot Password Sync</div>
      <div class="header-sub">Encrypted Vault Extension</div>
    </div>
  </div>

  <div id="status-badge" class="status-badge">
    <span class="status-dot"></span>
    <span id="status-text">Checking connection...</span>
  </div>

  <div class="form-group">
    <label for="server-url">Jot Server URL</label>
    <input type="text" id="server-url" placeholder="http://localhost:3000">
  </div>

  <div class="form-group">
    <label for="api-token">API Token (Optional)</label>
    <input type="password" id="api-token" placeholder="Optional Bearer token">
  </div>

  <button id="save-btn" class="btn btn-primary">Save & Connect</button>
  <a id="open-jot-btn" class="btn btn-secondary" href="http://localhost:3000" target="_blank">Open Jot Web App ↗</a>

  <div id="msg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
